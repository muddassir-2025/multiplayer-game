<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Strikers - Leaderboard</title>
    <style>
        :root {
            --bg-color: #050505;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --neon-blue: #00f3ff;
            --neon-purple: #bc13fe;
            --text-color: #ffffff;
            --font-family: 'Inter', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-family);
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background-image:
                radial-gradient(circle at 10% 20%, rgba(188, 19, 254, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(0, 243, 255, 0.1) 0%, transparent 20%);
        }

        /* Typography */
        h1,
        h2 {
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .hero {
            text-align: center;
            margin-top: 80px;
            margin-bottom: 50px;
            animation: fadeIn 1s ease-out;
        }

        .hero h1 {
            font-size: 3.5rem;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 1.2rem;
            color: #aaa;
            margin-bottom: 40px;
        }

        /* Button */
        .play-btn {
            display: inline-block;
            padding: 15px 50px;
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--bg-color);
            text-decoration: none;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple));
            border-radius: 50px;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .play-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(188, 19, 254, 0.6);
        }

        /* Leaderboard Container */
        .leaderboard-container {
            width: 90%;
            max-width: 800px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            margin-bottom: 50px;
            animation: slideUp 0.8s ease-out 0.2s backwards;
        }

        .leaderboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .leaderboard-header h2 {
            font-size: 1.5rem;
            color: var(--neon-blue);
        }

        /* Table */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 10px;
            color: #888;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        td {
            padding: 15px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            font-size: 1.1rem;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .rank {
            font-weight: bold;
            color: var(--neon-purple);
            width: 50px;
        }

        .score {
            font-weight: bold;
            color: var(--neon-blue);
            text-align: right;
        }

        .name {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 600px) {
            .hero h1 {
                font-size: 2.5rem;
            }

            .play-btn {
                padding: 12px 30px;
                font-size: 1.2rem;
            }
        }
    </style>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="hero">
        <h1>Box Strikers</h1>
        <p>Survive the chaos. Dominate the leaderboard.</p>
        <div class="btn-group">
            <a href="/game" class="btn-main">PLAY NOW</a>
            <button class="btn-main"
                style="background: transparent; border: 1px solid var(--neon-purple); color: var(--text-color); margin-left: 10px;"
                onclick="showTutorial()">HOW TO PLAY</button>
        </div>
    </div>

    <div class="leaderboard-container">
        <div class="leaderboard-header">
            <h2>Global Leaderboard</h2>
            <span style="font-size: 0.9rem; color: #666;">Top 10 Players</span>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Player</th>
                    <th style="text-align: right;">Score</th>
                </tr>
            </thead>
            <tbody id="leaderboard-body">
                <!-- Data will be injected here -->
                <tr>
                    <td colspan="3" style="text-align: center; color: #666; padding: 30px;">Loading Rankings...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Tutorial Overlay -->
    <div id="tutorial-overlay"
        style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 3000; align-items: center; justify-content: center; backdrop-filter: blur(10px);">
        <div
            style="background: rgba(20, 20, 20, 0.95); border: 1px solid #bc13fe; padding: 40px; border-radius: 15px; max-width: 500px; width: 90%; text-align: center; box-shadow: 0 0 30px rgba(188, 19, 254, 0.4);">
            <h2 style="color: #00f3ff; font-family: sans-serif; margin-bottom: 20px;">CONTROLS</h2>
            <div style="text-align: left; color: #fff; font-family: monospace; font-size: 1.1rem; line-height: 2;">
                <div>⬆️ ARROWS / WASD : Move & Fly</div>
                <div>💨 SHIFT : Dash (Speed Burst)</div>
                <div>🔫 ENTER : Shoot</div>
                <div>⚠️ SURVIVE : Speed increases over time!</div>
            </div>
            <button
                style="margin-top: 30px; background: linear-gradient(90deg, #bc13fe, #00f3ff); border: none; padding: 10px 40px; color: white; font-weight: bold; border-radius: 25px; cursor: pointer;"
                onclick="document.getElementById('tutorial-overlay').style.display='none'">CLOSE</button>
        </div>
    </div>

    <script>
        function showTutorial() {
            document.getElementById('tutorial-overlay').style.display = 'flex';
        }

        async function fetchLeaderboard() {
            try {
                const response = await fetch('/api/leaderboard');
                const data = await response.json();

                const tbody = document.getElementById('leaderboard-body');
                tbody.innerHTML = '';

                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3" style="text-align: center; padding: 30px;">No scores yet. Be the first!</td></tr>';
                    return;
                }

                data.forEach((entry, index) => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td class="rank">#${index + 1}</td>
                        <td class="name">${entry.name}</td>
                        <td class="score">${entry.score}</td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (error) {
                console.error('Error fetching leaderboard:', error);
                document.getElementById('leaderboard-body').innerHTML =
                    '<tr><td colspan="3" style="text-align: center; color: #ff4444;">Failed to load leaderboard</td></tr>';
            }
        }

        // Fetch immediately on load
        fetchLeaderboard();

        // Refresh every 10 seconds
        setInterval(fetchLeaderboard, 10000);
    </script>
</body>

</html>
